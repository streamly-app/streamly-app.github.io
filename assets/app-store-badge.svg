<?xml version="1.0" encoding="UTF-8"?>
<!-- Streamly "Download on the App Store" badge.
     Faithful to Apple's official badge design (Apple Marketing Guidelines):
     - Black rounded background
     - White Apple logo at left
     - "Download on the" small line above
     - "App Store" large line below
     SVG is scalable; viewport sized to render crisp at any width.
     Real Apple SVG should replace this before launch — grab from
     https://tools.applemediaservices.com/app-store/ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" width="240" height="80" role="img" aria-label="Download on the App Store">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#000"/>
    </linearGradient>
  </defs>

  <!-- Black rounded background -->
  <rect x="0" y="0" width="240" height="80" rx="14" ry="14" fill="url(#bg)" stroke="#fff" stroke-opacity="0.10"/>

  <!-- Apple logo, white, left side -->
  <g transform="translate(18, 18) scale(0.13)" fill="#fff">
    <path d="M223.41,141.7c-0.39-39.74,32.42-58.81,33.91-59.72c-18.47-27-47.18-30.71-57.41-31.13
             c-24.45-2.48-47.71,14.39-60.13,14.39c-12.43,0-31.62-14.04-51.94-13.65
             c-26.74,0.4-51.36,15.5-65.13,39.34c-27.74,48.07-7.1,119.36,19.93,158.43
             c13.23,19.1,29.07,40.61,49.95,39.84c20.07-0.83,27.65-12.87,51.92-12.87
             c24.27,0,31.07,12.87,52.34,12.42c21.61-0.4,35.34-19.39,48.55-38.59
             c15.31-22.13,21.61-43.49,21.99-44.6C266.96,205.42,224.05,189.39,223.41,141.7z
             M183.7,38.36c10.95-13.27,18.34-31.67,16.31-50.04
             c-15.78,0.63-34.85,10.5-46.19,23.78c-10.16,11.78-19.04,30.5-16.65,48.51
             C155.07,61.96,172.74,51.66,183.7,38.36z"/>
  </g>

  <!-- "Download on the" -->
  <text x="78" y="30"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif"
        font-size="12"
        fill="#fff"
        font-weight="400">Download on the</text>

  <!-- "App Store" -->
  <text x="78" y="58"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif"
        font-size="26"
        fill="#fff"
        font-weight="600"
        letter-spacing="-0.02em">App Store</text>
</svg>
