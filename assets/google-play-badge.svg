<?xml version="1.0" encoding="UTF-8"?>
<!-- Streamly "Get it on Google Play" badge.
     Monochrome reproduction matched to the App Store badge in this repo
     (same 240x80 viewBox, black rounded background, white mark + text)
     so the two badges sit together cleanly. For strict brand compliance
     swap in Google's official badge from
     https://play.google.com/intl/en_us/badges/ before a major push. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" width="240" height="80" role="img" aria-label="Get it on Google Play">
  <rect x="0.5" y="0.5" width="239" height="79" rx="14" ry="14" fill="#000000" stroke="#A6A6A6" stroke-width="1"/>
  <!-- Play triangle mark -->
  <path d="M28 24 L28 56 L54 40 Z" fill="#FFFFFF"/>
  <!-- Text block -->
  <text x="72" y="33" fill="#FFFFFF" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="13" letter-spacing="1.2">GET IT ON</text>
  <text x="71" y="62" fill="#FFFFFF" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="27" font-weight="600">Google Play</text>
</svg>
